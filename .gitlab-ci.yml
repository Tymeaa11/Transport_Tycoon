image: mcr.microsoft.com/dotnet/sdk:9.0

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

include:
  - component: szofttech.inf.elte.hu/components/code-quality-dotnet/windows@2
    inputs:
      check_path: "./VolcanicTransport/"


build-job:       # This job runs in the build stage, which runs first.
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0-windowsservercore-ltsc2025
  tags: [windows]
  before_script:
    - dotnet --version
  script:
    - dotnet build VolcanicTransport

test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  image: mcr.microsoft.com/dotnet/sdk:9.0-windowsservercore-ltsc2025
  tags: [windows]
  before_script:    
    # Restore NuGet packages to the local .nuget folder (inside the project directory).
    - dotnet restore VolcanicTransport/VolcanicTransport-Tests --packages .nuget

  script:
    - dotnet test VolcanicTransport/VolcanicTransport-Tests --no-restore --logger:"junit;MethodFormat=Class;FailureBodyFormat=Verbose" --collect="XPlat Code Coverage"

    # Install tools for code coverage extraction from Cobertura XML files
    - dotnet tool install --tool-path . dotnet-reportgenerator-globaltool
    # Compute code coverage percentage from Cobertura XML files through merging them with ReportGenerator
    # This is useful when you have multiple test projects in a repository
    # https://github.com/danielpalme/ReportGenerator
    - ./reportgenerator "-reports:$CI_PROJECT_DIR/VolcanicTransport/*/TestResults/*/coverage.cobertura.xml" "-targetdir:report" "-reporttypes:Cobertura"
    # Also generate a web-based summary of the code coverage, which we can publish later through GitLab Pages
    - ./reportgenerator "-reports:$CI_PROJECT_DIR/VolcanicTransport/*/TestResults/*/coverage.cobertura.xml" "-targetdir:report/html" "-reporttypes:Html"
    # The generated Cobertura.xml file contains the overall code coverage in a format like this:
    # <coverage line-rate="..." ...>
    - $coverage = [float](gc ./report/Cobertura.xml | select -first 1 -skip 2 | %{ $_ -replace '(.*)line-rate="(\d+\.\d+)"(.*)', '$2'}) * 100
    - echo "TOTAL_COVERAGE=$coverage"


    

  artifacts:
    paths:
     # - ./*
      - ./VolcanicTransport/*/TestResults/TestResults.xml
      - ./VolcanicTransport/*/TestResults/*/coverage.cobertura.xml
      - ./report/html/

    reports:
      junit:
        - ./VolcanicTransport/*/TestResults/TestResults.xml
      coverage_report:
          coverage_format: cobertura
          path: ./VolcanicTransport/*/TestResults/*/coverage.cobertura.xml
  coverage: '/TOTAL_COVERAGE=(\d+.\d+)/'

pages:
  stage: deploy
  image: ubuntu:24.04 # .NET SDK is not needed for this job
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq doxygen graphviz
  script:
    # Generate code documentation with Doxygen (see the Doxyfile for config)
    - doxygen
    - mkdir -p public/docs/
    - cp -r doc/html/. public/docs/
    # Add the code coverage web summary as well
    - mkdir -p public/covergae
    - cp -r report/html/. public/coverage/
  artifacts:
    paths:
      - public
  only:
    - master


